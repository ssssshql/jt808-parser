name: Deploy to Server via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run check

      - run: npm run build

      - name: Debug key and target
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "--- key fingerprint (expect SHA256:Vma8tiZlJiq4CgCQBI4OkITWPcQOVXIuHdv/LfHQvfM) ---"
          ssh-keygen -lf ~/.ssh/deploy_key || echo "KEY PARSE FAILED"
          echo "--- key line count ---"
          wc -l ~/.ssh/deploy_key
          echo "--- key first line ---"
          head -1 ~/.ssh/deploy_key
          echo "--- target ---"
          echo "user=[${{ secrets.SSH_USERNAME }}] host=[${{ secrets.SSH_HOST }}] port=2222"

      - name: Upload dist to server via SCP
        run: |
          ssh-keyscan -p 2222 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key -P 2222 -r dist/* "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/opt/1panel/www/sites/jt808-parser/index/"
