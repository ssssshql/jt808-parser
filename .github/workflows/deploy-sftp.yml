name: Deploy to Server via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run check

      - run: npm run build

      - name: Debug target values
        run: |
          U="${{ secrets.SSH_USERNAME }}"
          H="${{ secrets.SSH_HOST }}"
          echo "username length: ${#U} (expect 7 for ssssshql)"
          echo "username chars: $(echo -n "$U" | sed 's/./& /g')"
          echo "host length: ${#H} (expect 13 for 158.101.4.164)"
          echo "host value: $H"

      - name: Upload dist to server via SCP
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key -P 2222 -r dist/* "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/opt/1panel/www/sites/jt808-parser/index/"
